<!DOCTYPE html>

<html lang="es" data-theme="light">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="color-scheme" content="light">

<meta name="theme-color" content="#f5f1e8">

<title>Impulso Deli · Catálogo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

<style>

:root{

  --crema:#f5f1e8;

  --crema-2:#fffdf7;

  --marron:#4e342e;

  --marron-claro:#a67c52;

  --oliva:#7a8b6f;



  --bg:var(--crema);

  --panel:var(--crema-2);

  --texto:var(--marron);

  --texto-suave:#7a6259;

  --acento:var(--marron-claro);

  --linea:rgba(78,52,46,.16);

  --linea-fuerte:rgba(78,52,46,.3);

  --chip:rgba(166,124,82,.10);

  --btn:#4e342e;

  --btn-texto:#f5f1e8;

  --btn-hover:#a67c52;

}



*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%;color-scheme:light}

body{

  margin:0;

  background:var(--bg);

  color:var(--texto);

  font-family:"Karla","Segoe UI",system-ui,-apple-system,sans-serif;

  font-size:16px;

  line-height:1.5;

}

img{max-width:100%;display:block}

h1,h2,h3{font-family:"Bricolage Grotesque","Karla",system-ui,sans-serif;font-weight:800;line-height:1.05;margin:0}

a{color:inherit}

:focus-visible{outline:2.5px solid var(--acento);outline-offset:3px;border-radius:4px}

@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}



.wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 20px}



/* ---------- Encabezado ---------- */

header{padding:44px 0 26px;text-align:center}

.logo{width:min(360px,72vw);margin:0 auto}

.tagline{

  font-style:italic;font-size:1.05rem;color:var(--texto-suave);

  margin:18px 0 0;

}

.datos{

  margin:30px auto 0;max-width:860px;

  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

  gap:1px;background:var(--linea);

  border:1px solid var(--linea);border-radius:14px;overflow:hidden;

}

.dato{background:var(--panel);padding:16px 18px;text-align:left}

.dato dt{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--texto-suave);margin:0 0 5px}

.dato dd{margin:0;font-weight:500;font-size:.95rem}

.dato dd span{display:block;font-weight:400;color:var(--texto-suave);font-size:.9rem}



/* ---------- Barra de filtros ---------- */

.barra{

  position:sticky;top:0;z-index:20;

  background:var(--bg);

  border-bottom:1px solid var(--linea);

  padding:12px 0;margin-top:34px;

}

.barra-in{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.buscar{position:relative;flex:1 1 220px;min-width:180px}

.buscar input{

  width:100%;padding:10px 14px;border-radius:999px;

  border:1px solid var(--linea-fuerte);background:var(--panel);color:var(--texto);

  font:inherit;font-size:.95rem;

}

.buscar input::placeholder{color:var(--texto-suave)}

.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}

.cats::-webkit-scrollbar{height:0}

.cat{

  flex:0 0 auto;padding:9px 15px;border-radius:999px;cursor:pointer;

  border:1px solid var(--linea-fuerte);background:transparent;color:var(--texto);

  font:inherit;font-size:.9rem;font-weight:500;white-space:nowrap;

  transition:background .15s,color .15s,border-color .15s;

}

.cat[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-texto)}

.solo-stock{

  display:flex;align-items:center;gap:8px;cursor:pointer;

  font-size:.9rem;font-weight:500;color:var(--texto);white-space:nowrap;

  padding:8px 4px;

}

.solo-stock input{accent-color:var(--oliva);width:17px;height:17px;margin:0}



/* ---------- Grilla de productos ---------- */

main{padding:26px 0 10px}

.conteo{color:var(--texto-suave);font-size:.9rem;margin:0 0 18px}

.grupo{margin:0 0 38px}

.grupo > h2{

  font-size:1.35rem;display:flex;align-items:center;gap:12px;

  margin:0 0 16px;color:var(--acento);

}

.grupo > h2::after{content:"";flex:1;height:1px;background:var(--linea)}

.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}



.card{

  background:var(--panel);border:1px solid var(--linea);border-radius:16px;

  overflow:hidden;display:flex;flex-direction:column;

}

.card-cuerpo{padding:16px 18px 16px;display:flex;flex-direction:column;flex:1}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

.card h3{font-size:1.12rem;font-weight:600}

.card h3 em{font-style:normal;font-weight:400;font-size:.9rem;color:var(--texto-suave)}

.desc{margin:6px 0 0;font-size:.88rem;color:var(--texto-suave)}



.stock{

  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;

  font-size:.76rem;font-weight:700;letter-spacing:.02em;

  padding:5px 10px;border-radius:999px;border:1px solid;

}

.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

.stock.hay{color:var(--oliva);border-color:rgba(122,139,111,.45);background:rgba(122,139,111,.12)}

.stock.poco{color:#b06f25;border-color:rgba(176,111,37,.4);background:rgba(176,111,37,.12)}

.stock.no{color:#9a5a52;border-color:rgba(154,90,82,.4);background:rgba(154,90,82,.12)}



.medidas{

  list-style:none;margin:16px 0 0;padding:0;

  display:flex;flex-direction:column;gap:8px;

}

.medida{

  background:var(--chip);border:1px solid var(--linea);border-radius:10px;

  padding:9px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;

}

.medida .info{display:flex;flex-direction:column;line-height:1.25}

.medida .peso{font-size:.76rem;color:var(--texto-suave);font-weight:500}

.medida .precio{font-weight:700;font-size:1rem}

.medida.vacia{opacity:.45}

.medida.vacia .precio{font-weight:400;color:var(--texto-suave)}



.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--linea-fuerte);border-radius:999px;overflow:hidden;flex:0 0 auto}

.stepper button{

  width:30px;height:30px;border:none;background:transparent;color:var(--texto);

  font-size:1.05rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;

  font-family:inherit;

}

.stepper button:hover{background:var(--chip)}

.stepper button:disabled{opacity:.35;cursor:not-allowed}

.stepper .cant{min-width:22px;text-align:center;font-weight:700;font-size:.9rem}



.wa{

  margin-top:16px;display:flex;align-items:center;justify-content:center;gap:9px;

  padding:11px 16px;border-radius:999px;text-decoration:none;border:none;

  background:var(--btn);color:var(--btn-texto);

  font-weight:700;font-size:.93rem;cursor:pointer;font-family:inherit;

  transition:background .15s;width:100%;

}

.wa:hover{background:var(--btn-hover)}

.wa svg{width:18px;height:18px;flex:0 0 auto;fill:currentColor}

.wa.off{background:transparent;color:var(--texto-suave);border:1px dashed var(--linea-fuerte);cursor:not-allowed;font-weight:500}



/* ---------- Carrito ---------- */

.carrito-boton{

  position:fixed;right:20px;bottom:20px;z-index:40;

  display:flex;align-items:center;gap:9px;

  background:var(--marron);color:var(--crema);border:none;

  padding:14px 20px;border-radius:999px;cursor:pointer;font-family:inherit;

  font-weight:700;font-size:.95rem;box-shadow:0 8px 22px rgba(78,52,46,.28);

  transition:transform .15s;

}

.carrito-boton:hover{transform:translateY(-2px)}

.carrito-boton svg{width:19px;height:19px;fill:currentColor}

.carrito-boton .badge{

  background:var(--crema);color:var(--marron);border-radius:999px;

  min-width:20px;height:20px;padding:0 5px;font-size:.76rem;font-weight:800;

  display:flex;align-items:center;justify-content:center;

}

.carrito-boton[hidden]{display:none}



.overlay{

  position:fixed;inset:0;background:rgba(46,30,26,.4);z-index:50;

  opacity:0;pointer-events:none;transition:opacity .2s;

}

.overlay.show{opacity:1;pointer-events:auto}



.panel{

  position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:51;

  background:var(--panel);box-shadow:-14px 0 30px rgba(0,0,0,.15);

  display:flex;flex-direction:column;

  transform:translateX(100%);transition:transform .25s ease;

}

.panel.show{transform:translateX(0)}

.panel-head{

  display:flex;align-items:center;justify-content:space-between;

  padding:18px 20px;border-bottom:1px solid var(--linea);

}

.panel-head h2{font-size:1.2rem}

.cerrar{

  width:34px;height:34px;border-radius:50%;border:1px solid var(--linea-fuerte);

  background:transparent;color:var(--texto);font-size:1.2rem;cursor:pointer;

  display:flex;align-items:center;justify-content:center;font-family:inherit;

}

.cerrar:hover{background:var(--chip)}

.panel-items{flex:1;overflow-y:auto;padding:8px 20px}

.item{

  display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea);

}

.item .item-info{flex:1;min-width:0}

.item .item-info .nom{font-weight:600;font-size:.92rem}

.item .item-info .peso{font-size:.8rem;color:var(--texto-suave)}

.item .item-precio{font-weight:700;font-size:.88rem;white-space:nowrap}

.item .quitar{

  background:none;border:none;color:var(--texto-suave);cursor:pointer;font-size:1.15rem;

  padding:4px;line-height:1;

}

.item .quitar:hover{color:#9a5a52}

.panel-vacio{padding:50px 20px;text-align:center;color:var(--texto-suave)}

.panel-vacio strong{display:block;color:var(--texto);font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;margin-bottom:6px}

.panel-foot{border-top:1px solid var(--linea);padding:18px 20px 22px}

.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}

.total-row span:first-child{color:var(--texto-suave);font-size:.92rem}

.total-row span:last-child{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem}

.vaciar{

  display:block;width:100%;text-align:center;background:none;border:none;

  color:var(--texto-suave);font-size:.82rem;margin-top:10px;cursor:pointer;font-family:inherit;

  text-decoration:underline;

}

.vaciar:hover{color:var(--texto)}



.vacio{

  text-align:center;padding:60px 20px;color:var(--texto-suave);

  border:1px dashed var(--linea-fuerte);border-radius:16px;

}

.vacio strong{display:block;color:var(--texto);font-size:1.1rem;margin-bottom:6px;font-family:"Bricolage Grotesque",sans-serif}



/* ---------- Pie ---------- */

footer{

  border-top:1px solid var(--linea);margin-top:40px;padding:34px 0 46px;

  text-align:center;color:var(--texto-suave);font-size:.9rem;

}

.footer-wa{

  display:inline-flex;align-items:center;gap:10px;text-decoration:none;

  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.5rem;

  color:var(--texto);margin-bottom:10px;

}

.footer-wa svg{width:26px;height:26px;fill:var(--oliva)}

.nota{margin:14px 0 0;font-size:.82rem}



@media (max-width:560px){

  header{padding:30px 0 20px}

  .grilla{grid-template-columns:1fr}

  .barra-in{gap:8px}

  .cats{order:3;width:100%}

  .footer-wa{font-size:1.25rem}

}

</style>

</head>
